name: 每日保險財經新聞網頁

on:
  schedule:
    # GitHub 用 UTC；22:30 UTC = 台灣 06:30，預留排程延遲，約 7 點前網頁就緒
    - cron: "30 22 * * *"
  workflow_dispatch:   # 可在 GitHub 頁面手動執行

permissions:
  contents: write      # 把每天的網頁存回 repo（保留歷史）
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 抓新聞 + AI 整理 + 產生網頁
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python main.py

      - name: 保存網頁到 repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site
          git commit -m "每日新聞 $(TZ=Asia/Taipei date +%F)" || echo "沒有變更"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
